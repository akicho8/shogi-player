      }
      td {

      td {
        position: relative;
      }
      td:after {

        top: 0px;
        left: 0px;
        /* transform: translate(calc(-3dvmin / 2), calc(-3dvmin / 2)); */

        height: 3dvmin;
        z-index: 1;
        background: blue;
        content: "";
        border-radius: calc(3dvmin / 2);
      }

<!doctype html>
<html>
  <head>
    <style type="text/css">
      table {
        background: black;
        border-collapse: separate;
        border-spacing: 1px;
        width: 80dvmin;
        height: 80dvmin;
      }
      td {
        background: white;
      }
      tr:nth-child(3n+4) td:nth-child(3n+4) {
        position: relative;
      }
      tr:nth-child(3n+4) td:nth-child(3n+4):after {
        position: absolute;
        content: "";
        top:  calc(-2dvmin / 2);
        left: calc(-2dvmin / 2);
        width:  2dvmin;
        height: 2dvmin;
        border-radius: 50%;
        background: black;
      }
    </style>
  </head>
  <body>
    <table>
      <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
      <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
      <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
      <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
      <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
      <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
      <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
      <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
      <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    </table>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <filter id="hairline">
    <feTurbulence type="fractalNoise" baseFrequency="0.5 0.002" numOctaves="2" result="lines" />
    <feDiffuseLighting in="lines" lighting-color="hsl(0 0% 100%)" surfaceScale="1">
      <feDistantLight azimuth="90" elevation="60" />
    </feDiffuseLighting>
  </filter>

  <!-- Main Color -->
  <rect width="100%" height="100%" fill="hsl(0 0% 70%)" />
  <rect width="100%" height="100%" filter="url(#hairline)" style="mix-blend-mode: multiply; opacity: 0.4;" />
</svg>

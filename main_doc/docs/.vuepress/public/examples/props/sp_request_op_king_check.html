<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script defer src="https://cdn.jsdelivr.net/npm/shogi-player@2.0.0"></script>
  <script type="module">
    const el = document.querySelector("shogi-player-wc")
    el.addEventListener("ev_play_mode_move", e => {
      const params = e.detail[0]
      if (params.op_king_check) {
        alert(params.op_king_check ? "王手" : "王手していない")
      }
    })
  </script>
</head>
<body>
  <shogi-player-wc
    sp_mode="play"
    sp_body="position sfen 8k/9/6+R2/9/9/9/9/9/9 b r2b4g4s4n4l18p 1"
    sp_request_op_king_check="true"
    ></shogi-player-wc>
</body>
</html>
